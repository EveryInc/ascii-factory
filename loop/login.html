<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy loop</title>
<style>
  /* the dashboard's colours and controls, for the one page a hosted dashboard shows before it */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --wash: rgba(11,11,11,.04);
    --ink: #0b0b0b; --ink2: #52514e; --border: rgba(11,11,11,.10);
    --series: #2a78d6; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --wash: rgba(255,255,255,.05);
      --ink: #ffffff; --ink2: #c3c2b7; --border: rgba(255,255,255,.10);
      --series: #3987e5; --critical: #e66767;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: min(300px, 100%); display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.3; }
  button, input { font: inherit; color: inherit; }
  .row { display: flex; gap: 6px; }
  .field { flex: 1; min-width: 0; display: flex; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0 10px; }
  .field input { flex: 1; min-width: 0; border: 0; background: none; padding: 7px 0; outline: none; }
  button { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--wash); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, .field:focus-within { outline: 2px solid var(--series); outline-offset: 1px; }
  #why { margin: 0; min-height: 1.45em; color: var(--critical); }
</style>
</head>
<body>
<form id="login">
  <h1>Toy loop</h1>
  <div class="row">
    <label class="field"><input type="password" id="password" aria-label="Password" placeholder="Password" autocomplete="current-password" autofocus required></label>
    <button>Sign in</button>
  </div>
  <p id="why" role="alert"></p>
</form>

<script>
const $ = (id) => document.getElementById(id)

$('login').addEventListener('submit', async (e) => {
  e.preventDefault()
  const button = e.target.querySelector('button')
  button.disabled = true
  $('why').textContent = ''
  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ password: $('password').value }),
  }).catch(() => null)
  if (res?.ok) return location.reload()
  button.disabled = false
  $('why').textContent = !res ? 'No reply from the server.' : res.status === 429 ? 'Too many tries. Wait a minute.' : 'Wrong password.'
  $('password').select()
})
</script>
</body>
</html>
